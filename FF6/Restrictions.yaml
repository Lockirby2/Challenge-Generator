        - "Main Command By Party Position"
    weight: 1.0
    difficulty: 2.0
    limiting: false
    message: "Each character may only use one command in battle, based on party position. The character in the top slot may only use Fight. The character in the second slot may only use their special command. The character in the third slot may only use Magic. The character in the bottom slot may only use Item."
    
