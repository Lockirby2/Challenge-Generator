--- # All YAML files must have this triple-dash at the start
- # Each list item must have a dash beforehand
    name: "No Weapons" # The short name of the restriction
    tags: # List out tags with dashes beforehand (used for determining which restrictions conflict with each other)
        - "Equipment"
    weight: 1.0 # Higher weight means that the restriction is more likely to appear; a restriction with a weight of 7.0 is 7 times as likely to show up as one with a weight of 1.0
    difficulty: 1.0 # Difficulty of a restriction relative to the other restrictions; total difficulty of all restrictions chosen won't exceed the target difficulty
    limiting: false # Whether this restriction limits the amount of EXP grinding that is possible
    message: "You cannot equip weapons to any character." # Detailed description of the restriction's rules
    
-
    name: "No Shields"
    tags:
        - "Equipment"
    weight: 1.0
    difficulty: 2.0
    limiting: false
    message: "You cannot equip shields to any character."

-
    name: "No Helmets"
    tags:
        - "Equipment"
    weight: 1.0
    difficulty: 1.0
    limiting: false
    message: "You cannot equip helmets to any character."
    
-
    name: "No Armours"
    tags:
        - "Equipment"
    weight: 1.0
    difficulty: 2.0
    limiting: false
    message: "You cannot equip body armour to any character."
    
-
    name: "One Relic"
    tags:
        - "Equipment"
        - "Relic"
    weight: 1.0
    difficulty: 1.5
    limiting: false
    message: "You may only equip one Relic to each character."
    
-
    name: "No Relics"
    tags:
        - "Equipment"
        - "Relic"
    weight: 3.0
    difficulty: 3.0
    limiting: false
    message: "You cannot equip Relics to any character."
    
-
    name: "No Best-In-Slot"
    tags:
        - "Equipment"
    weight: 1.0
    difficulty: 2.0
    limiting: false
    message: "You cannot equip the Illumina, Paladin Shield, Green Beret, Snow Muffler, Economizer, or Ribbon to any character."
    
-
    name: "Slot Sharing"
    tags:
        - "Equipment"
    weight: 1.0
    difficulty: 3.0
    limiting: false
    message: "Each equipment slot may only be filled by a single party member. For example, if Terra is wearing a helmet, no other character in the current party may equip a helmet. Each Relic slot is counted separately.  Each character in the party must fill at least one equipment slot (unless prevented by other restrictions)."
    
-
    name: "No Main Equipment"
    tags:
        - "Equipment"
        - "Heavy Equipment"
    weight: 7.0
    difficulty: 6.0
    limiting: false
    message: "You cannot equip any equipment to any character (Relics are allowed)."
    
-
    name: "No Equipment"
    tags:
        - "Equipment"
        - "Heavy Equipment"
    weight: 7.0
    difficulty: 9.0
    limiting: false
    message: "You cannot equip any equipment to any character (including Relics)."
    
-
    name: "No Evasive Equipment"
    tags:
        - "Equipment"
        - "Heavy Equipment"
    weight: 1.0
    difficulty: 5.0
    limiting: false
    message: "You cannot equip any equipment with more than 10 Evade or 10 Magic Evade to any character (including Relics)."
    
-
    name: "Stolen Equipment Only"
    tags:
        - "Equipment"
        - "Heavy Equipment"
    weight: 1.0
    difficulty: 7.0
    limiting: false
    message: "You cannot equip any equipment unless it was stolen from an enemy."
    
-
    name: "Low Level"
    tags:
        - "Level"
        - "Running"
    weight: 10.0
    difficulty: 10.0
    limiting: true
    message: "You must keep characters' levels as low as possible (Standard LLG rules apply)."
    
-
    name: "No Random Encounters"
    tags:
        - "Level"
        - "Running"
    weight: 3.0
    difficulty: 10.0
    limiting: true
    message: "You must immediately run from all random encounters. You cannot loop on the Lete River, and cannot ride it twice. You may not open the trap door in the Burning House."
    
-
    name: "0 EXP"
    tags:
        - "Level"
    weight: 3.0
    difficulty: 9.0
    limiting: true
    message: "You must use cheat codes or hacks to ensure that you gain no EXP."
    
-
    name: "No Grinding"
    tags:
        - "Level"
    weight: 1.0
    difficulty: 2.0
    limiting: true
    message: "You may not grind extra levels, GP, Items, etc. Use your best judgment about what constitutes 'grinding'"
    
-
    name: "No Running"
    tags:
        - "Running"
    weight: 4.0
    difficulty: 1.0
    limiting: false
    message: "You may not run from random encounters."
    
-
    name: "Natural Magic"
    tags:
        - "Moves"
        - "Magic"
        - "Heavy Magic"
        - "Main Command"
    weight: 10.0
    difficulty: 9.0
    limiting: false
    message: "You may not gain any spell AP from Espers or equipment."
    
-
    name: "No Magic"
    tags:
        - "Moves"
        - "Magic"
        - "Heavy Magic"
        - "Main Command"
    weight: 10.0
    difficulty: 9.0
    limiting: false
